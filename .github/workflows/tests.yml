name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        # The tests use a fake model: TensorFlow and the GUI/video stack are not needed.
        run: pip install "numpy<2" scipy pandas opencv-python-headless tqdm soundfile pytest
      - name: Run tests
        run: python -m pytest -q
